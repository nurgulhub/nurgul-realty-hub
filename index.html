<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8" />
  <title>Nurgul Realty</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Nurgul Realty — Premium real estate advisory built on trust, quality and human expertise." />

  <style>
    :root{
      --green-dark:#081B17;
      --green-main:#0F2A24;
      --yellow-main:#F2C94C;
      --yellow-soft:#FFE08A;
      --text-main:#F5F7F6;
      --text-muted:#A8B3AF;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      background:var(--green-dark);
      color:var(--text-main);
      overflow-x:hidden;
    }

    /* ================= HEADER ================= */
    header{
      position:fixed;
      top:0; left:0; right:0;
      height:120px;
      padding:0 36px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      z-index:50;
      background:rgba(8,27,23,0.88);
      backdrop-filter:blur(10px);
    }

    .brand{
      display:flex;
      align-items:center;
      position:relative;
    }

    .brand-logo{
      height:250px;
      width:auto;
      position:relative;
      z-index:2;
    }

    /* GOLD SUN — PROPORTIONAL TO 250px LOGO */
.brand::before{
  content: "";
  position: absolute;

  /* equilibrio visual hacia la izquierda */
  left: -140px;
  top: 50%;
  transform: translateY(-50%);

  /* ☀️ debe ser MÁS GRANDE que el logo */
  width: 460px;
  height: 460px;

  background: radial-gradient(
    circle,
    rgba(242,201,76,0.50) 0%,
    rgba(242,201,76,0.32) 20%,
    rgba(242,201,76,0.18) 40%,
    rgba(242,201,76,0.08) 60%,
    transparent 80%
  );

  /* suavidad premium, no foco */
  filter: blur(46px);

  z-index: 1;
  pointer-events: none;
}
    
@media (max-width: 768px){
  .brand::before{
    width: 380px;
    height: 380px;
    left: -115px;
    filter: blur(38px);
  }
}

@media (max-width: 420px){
  .brand::before{
    width: 320px;
    height: 320px;
    left: -95px;
    filter: blur(32px);
  }
}
    .lang-switch{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .lang-world svg{
      width:22px;
      height:22px;
      stroke:#fff;
      opacity:.85;
    }

    .lang-item{
      font-size:18px;
      cursor:pointer;
      opacity:.45;
      transition:.25s ease;
    }

    .lang-item.active{
      opacity:1;
      filter:drop-shadow(0 0 6px rgba(201,179,126,.45));
    }

    /* ================= HERO (ARREGLADO) ================= */
    .hero{
      min-height:100svh;
      padding:200px 20px 80px; /* 🔑 header + aire */
      display:flex;
      align-items:center;
      background:
        radial-gradient(circle at 20% 20%, rgba(242,201,76,.15), transparent 45%),
        linear-gradient(180deg, var(--green-main), var(--green-dark));
    }

    .hero-content{
      max-width:760px;
      margin:0 auto;
    }

    .hero h1{
      font-size:clamp(36px,7vw,64px);
      line-height:1.1;
      font-weight:500;
      margin-bottom:24px;
    }

    .hero p{
      font-size:clamp(16px,3.8vw,20px);
      line-height:1.6;
      color:var(--text-muted);
      max-width:620px;
      margin-bottom:48px;
    }

    .hero-btn{
      display:inline-block;
      padding:16px 38px;
      border:1px solid var(--yellow-main);
      color:var(--yellow-main);
      text-decoration:none;
      letter-spacing:2px;
      font-size:13px;
      transition:.3s ease;
    }

    .hero-btn:hover{
      background:var(--yellow-main);
      color:#000;
    }

    @media(max-width:768px){
      header{height:104px}
      .brand-logo{height:72px}
      .hero{padding-top:180px}
    }

    @media(max-width:420px){
      header{height:92px}
      .brand-logo{height:64px}
      .hero{padding-top:160px}
  }
}
    
</style>
</head>

<body>

<header>
  <div class="brand">
  <img
    src="logo/nurgul-realty-hub-header.png"
    alt="Nurgul Realty Hub"
    class="brand-logo"
  >
</div>

  <div class="lang-switch">
    <span class="lang-world">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4"/>
        <ellipse cx="12" cy="12" rx="4" ry="9" stroke="currentColor" stroke-width="1.2"/>
        <path d="M3 12h18" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </span>
    <span class="lang-item active" data-lang="ky">🇰🇬</span>
    <span class="lang-item" data-lang="ru">🇷🇺</span>
    <span class="lang-item" data-lang="en">🇬🇧</span>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1 data-i18n="hero_title">
      Ишеним — бул стиль.<br>Тандоо — бул сапат.
    </h1>
    <p data-i18n="hero_sub">
      Нургул менен кыймылсыз мүлк — бул жөн гана сатып алуу эмес.
      Бул туура чечим.
    </p>
    <a href="properties.html" class="hero-btn" data-i18n="hero_btn">
      ТУУРА ТАНДООНУ КӨРҮҮ
    </a>
  </div>
</section>

<script>
const translations={
  ky:{
    hero_title:"Ишеним — бул стиль.<br>Тандоо — бул сапат.",
    hero_sub:"Нургул менен кыймылсыз мүлк — бул жөн гана сатып алуу эмес. Бул туура чечим.",
    hero_btn:"ТУУРА ТАНДООНУ КӨРҮҮ"
  },
  ru:{
    hero_title:"Доверие — это стиль.<br>Выбор — это качество.",
    hero_sub:"С Nurgul недвижимость — это не просто покупка. Это правильное решение.",
    hero_btn:"ПОСМОТРЕТЬ ВАРИАНТЫ"
  },
  en:{
    hero_title:"Trust is a style.<br>Choice is quality.",
    hero_sub:"With Nurgul, real estate is more than a purchase. It is the right decision.",
    hero_btn:"EXPLORE OPTIONS"
  }
};

document.querySelectorAll(".lang-item").forEach(btn=>{
  btn.onclick=()=>{
    const lang=btn.dataset.lang;
    document.querySelectorAll("[data-i18n]").forEach(el=>{
      el.innerHTML=translations[lang][el.dataset.i18n];
    });
    document.querySelectorAll(".lang-item").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
  };
});
</script>

</body>
</html>
