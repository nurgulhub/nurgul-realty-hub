<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8" />
  <title>Nurgul Realty</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO básico -->
  <meta name="description" content="Nurgul Realty — Premium real estate advisory built on trust, quality and human expertise." />

  <style>
    :root{
      --green-dark:#081B17;
      --green-main:#0F2A24;
      --yellow-main:#F2C94C;
      --yellow-soft:#FFE08A;
      --text-main:#F5F7F6;
      --text-muted:#A8B3AF;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background:var(--green-dark);
      color:var(--text-main);
      overflow-x:hidden;
    }

   /* ================= HEADER ================= */
header{
  position:fixed;
  top:0; left:0; right:0;
  height:120px;
  padding:0 36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:50;
  background:rgba(8,27,23,0.88);
  backdrop-filter: blur(10px);
}

/* === BRAND — NURGUL REALTY HUB (PROTAGONIST) === */
.brand{
  display:flex;
  align-items:center;
  position:relative;
}

/* Logo image */
.brand-logo{
  height:88px;               /* PROTAGONISTA */
  width:auto;
  display:block;
  position:relative;
  z-index:2;
}

/* Gold halo */
.brand::before{
  content:"";
  position:absolute;
  left:-34px;
  top:50%;
  transform:translateY(-50%);
  width:160px;
  height:160px;
  background:radial-gradient(
    circle,
    rgba(201,179,126,0.38) 0%,
    rgba(201,179,126,0.18) 35%,
    rgba(201,179,126,0.08) 55%,
    transparent 72%
  );
  filter:blur(14px);
  z-index:1;
  pointer-events:none;
}

/* === LANGUAGE SWITCHER === */
.lang-switch{
  display:flex;
  align-items:center;
  gap:16px;
}

.lang-world svg{
  width:22px;
  height:22px;
  stroke:#ffffff;
  opacity:.85;
}

.lang-item{
  font-size:18px;
  cursor:pointer;
  opacity:.45;
  transition:.25s ease;
}

.lang-item:hover{
  opacity:.8;
}

.lang-item.active{
  opacity:1;
  filter:drop-shadow(0 0 6px rgba(201,179,126,.45));
}

/* ===== RESPONSIVE ===== */
@media (max-width:768px){
  header{height:104px}
  .brand-logo{height:72px}
  .brand::before{
    width:130px;
    height:130px;
  }
}

@media (max-width:420px){
  header{height:92px}
  .brand-logo{height:64px}
  .brand::before{
    width:110px;
    height:110px;
  }
}
    
</style>
</head>

<body>

<header>

  <!-- BRAND -->
  <div class="brand">
    <img 
      src="/logo/nurgul-realty-hub-header.png" 
      alt="Nurgul Realty Hub" 
      class="brand-logo"
    >
  </div>

  <!-- LANGUAGES -->
  <div class="lang-switch">
    <span class="lang-world" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4"/>
        <ellipse cx="12" cy="12" rx="4" ry="9" stroke="currentColor" stroke-width="1.2"/>
        <path d="M3 12h18" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </span>

    <span class="lang-item active" data-lang="ky">🇰🇬</span>
    <span class="lang-item" data-lang="ru">🇷🇺</span>
    <span class="lang-item" data-lang="en">🇬🇧</span>
  </div>

</header>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="hero-content">
    <h1 data-i18n="hero_title">
      Ишеним — бул стиль.<br>Тандоо — бул сапат.
    </h1>

    <p data-i18n="hero_sub">
      Нургул менен кыймылсыз мүлк — бул жөн гана сатып алуу эмес.
      Бул туура чечим.
    </p>

    <a href="properties.html" class="hero-btn" data-i18n="hero_btn">
      ТУУРА ТАНДООНУ КӨРҮҮ
    </a>
  </div>
</section>

<!-- ================= LANGUAGE ENGINE ================= -->
<script>
const translations = {
  ky:{
    hero_title:"Ишеним — бул стиль.<br>Тандоо — бул сапат.",
    hero_sub:"Нургул менен кыймылсыз мүлк — бул жөн гана сатып алуу эмес. Бул туура чечим.",
    hero_btn:"ТУУРА ТАНДООНУ КӨРҮҮ"
  },
  ru:{
    hero_title:"Доверие — это стиль.<br>Выбор — это качество.",
    hero_sub:"С Nurgul недвижимость — это не просто покупка. Это правильное решение.",
    hero_btn:"ПОСМОТРЕТЬ ВАРИАНТЫ"
  },
  en:{
    hero_title:"Trust is a style.<br>Choice is quality.",
    hero_sub:"With Nurgul, real estate is more than a purchase. It is the right decision.",
    hero_btn:"EXPLORE OPTIONS"
  }
};

document.querySelectorAll(".lang-item").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const lang=btn.dataset.lang;

    document.querySelectorAll("[data-i18n]").forEach(el=>{
      el.innerHTML = translations[lang][el.dataset.i18n];
    });

    document.querySelectorAll(".lang-item").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
  });
});
</script>

</body>
</html>
