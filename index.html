<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <title>Nurgul Realty Hub</title>

  <!-- Meta SEO -->
  <meta name="description" content="Нургул тарабынан башкарылган кыймылсыз мүлк объектилерин кесипкөй көрсөтүү жана кардарлар менен байланыш борбору.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Basic Styles -->
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
      color: #222;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid #ddd;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
    }

    .tagline {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .contact-btn {
      background-color: #0b6b3a;
      color: #fff;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }

    .contact-btn:hover {
      background-color: #095c32;
    }

    main {
      padding: 32px 24px;
      max-width: 1100px;
      margin: auto;
    }

    .hero {
      background-color: #ffffff;
      padding: 32px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .hero h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .hero p {
      font-size: 16px;
      line-height: 1.6;
      color: #444;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div>
      <div class="brand">Nurgul Realty Hub</div>
      <div class="tagline">Кыймылсыз мүлк боюнча ишенимдүү платформа</div>
    </div>
    <button class="contact-btn">WhatsApp</button>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <section class="hero">
      <h1>Үйүңүздү ишенимдүү тандаңыз</h1>
      <p>
        Биз сизге Бишкек жана анын айланасындагы эң мыкты кыймылсыз мүлк объектилерин
        кесипкөй түрдө сунуштайбыз. Сатып алуу, ижарага алуу жана консультация үчүн
        биз менен байланышыңыз.
      </p>
    </section>
  </main>

</body>
</html>
