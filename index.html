<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8" />
  <title>Nurgul Realty</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Nurgul Realty — Premium real estate advisory built on trust, quality and human expertise." />

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  
  <style>
    :root{
      --green-dark:#081B17;
      --green-main:#0F2A24;
      --yellow-main:#F2C94C;
      --yellow-soft:#FFE08A;
      --text-main:#F5F7F6;
      --text-muted:#A8B3AF;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      background:var(--green-dark);
      color:var(--text-main);
      overflow-x:hidden;
    }

    /* ================= HEADER ================= */
    
    header{
      position:fixed;
      top:0; left:0; right:0;
      height:120px;
      padding:0 36px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      z-index:50;
      background:rgba(8,27,23,0.88);
      backdrop-filter:blur(10px);
    }

 .brand{
  display:flex;
  align-items:center;
  position:relative;
  transform: translate(-40px, 14px); /* izquierda + abajo */
}

.brand-logo{
  height:280px;
  width:auto;
  display:block;
  position:relative;
  z-index:2;
  filter:
    drop-shadow(0 0 2px rgba(242,201,76,0.35))
    drop-shadow(0 0 10px rgba(242,201,76,0.18));
}
   
.brand-logo{
  filter:
    drop-shadow(0 0 2px rgba(242,201,76,0.35))
    drop-shadow(0 0 10px rgba(242,201,76,0.18));
}
  /* GOLD SUN — PROPORTIONAL TO 250px LOGO */
    
.brand::before{
  content:"";
  position:absolute;
  left:-80px;                 /* empuja el sol hacia la izquierda */
  top:50%;
  transform:translateY(-50%);
  width:480px;                /* MUCHO más grande */
  height:260px;
  background:radial-gradient(
    ellipse,
    rgba(242,201,76,0.75) 0%,   /* núcleo fuerte */
    rgba(242,201,76,0.55) 25%,
    rgba(242,201,76,0.32) 45%,
    rgba(242,201,76,0.16) 60%,
    rgba(242,201,76,0.06) 72%,
    transparent 85%
  );
  filter:blur(34px);          /* expansión tipo sol */
  z-index:1;
  pointer-events:none;
}

    
@media (max-width: 768px){
  .brand::before{
    width: 380px;
    height: 380px;
    left: -115px;
    filter: blur(38px);
  }
}

@media (max-width: 420px){
  .brand::before{
    width: 320px;
    height: 320px;
    left: -95px;
    filter: blur(32px);
  }
}
    .lang-switch{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .lang-world svg{
      width:22px;
      height:22px;
      stroke:#fff;
      opacity:.85;
    }

    .lang-item{
      font-size:18px;
      cursor:pointer;
      opacity:.45;
      transition:.25s ease;
    }

    .lang-item.active{
      opacity:1;
      filter:drop-shadow(0 0 6px rgba(201,179,126,.45));
    }

    /* ================= HERO (ARREGLADO) ================= */
    .hero{
      min-height:100svh;
      padding:200px 20px 80px; /* 🔑 header + aire */
      display:flex;
      align-items:center;
      background:
        radial-gradient(circle at 20% 20%, rgba(242,201,76,.15), transparent 45%),
        linear-gradient(180deg, var(--green-main), var(--green-dark));
    }

    .hero-content{
      max-width:760px;
      margin:0 auto;
    }

    .hero h1{
      font-size:clamp(36px,7vw,64px);
      line-height:1.1;
      font-weight:500;
      margin-bottom:24px;
    }

    .hero p{
      font-size:clamp(16px,3.8vw,20px);
      line-height:1.6;
      color:var(--text-muted);
      max-width:620px;
      margin-bottom:48px;
    }

    .hero-btn{
      display:inline-block;
      padding:16px 38px;
      border:1px solid var(--yellow-main);
      color:var(--yellow-main);
      text-decoration:none;
      letter-spacing:2px;
      font-size:13px;
      transition:.3s ease;
    }

    .hero-btn:hover{
      background:var(--yellow-main);
      color:#000;
    }

    @media(max-width:768px){
      header{height:104px}
      .brand-logo{height:72px}
      .hero{padding-top:180px}
    }

    @media(max-width:420px){
      header{height:92px}
      .brand-logo{height:64px}
      .hero{padding-top:160px}
  }
}

/* ================= GLOBAL RESPONSIVE ================= */

@media (max-width: 1024px){
  header{
    height:96px;
    padding:0 24px;
  }

  .brand-logo{
    height:180px;
  }

  main{
    padding-top:140px;
  }
}

@media (max-width: 768px){
  header{
    height:84px;
    padding:0 16px;
  }

  .brand{
    transform: translate(-12px, 6px);
  }

  .brand-logo{
    height:140px;
  }

  .lang-item{
    font-size:16px;
  }

  main{
    padding-top:120px;
  }

  .property-btn{
    font-size:13px;
    padding:10px 22px;
  }
}

@media (max-width: 600px){
  .brand-logo{
    height:120px;
  }

  .lang-switch{
    gap:10px;
  }
}

@media (max-width: 420px){
  .brand-logo{
    height:105px;
  }

  header{
    height:78px;
  }
}

/* ================= HERO — RESPONSIVE ================= */

@media (max-width: 1024px){
  .hero h1{
    font-size:clamp(34px, 6vw, 48px);
  }
}

@media (max-width: 768px){
  .hero h1{
    font-size:clamp(26px, 7vw, 34px);
    line-height:1.2;
  }

  .hero p{
    font-size:14px;
  }

  .hero .property-btn{
    padding:12px 22px;
  }
}

/* ============================================================
   🌐 LANGUAGE SWITCH — GLASS FLAG (TRANSPARENT + RELIEF)
   ============================================================ */

.lang-switch {
  display: flex;
  gap: 10px;
}

.lang-item {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;

  /* Transparent base */
  background: transparent;

  /* Gold ring */
  border: 1.5px solid rgba(212, 175, 55, 0.75);

  /* Subtle outer glow */
  box-shadow:
    0 0 8px rgba(212, 175, 55, 0.45),
    inset 0 2px 4px rgba(255, 255, 255, 0.35);

  overflow: hidden;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

/* Flag with light relief */
.lang-item img {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  z-index: 2;

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.6),
    inset 0 -1px 2px rgba(0,0,0,0.35),
    0 2px 4px rgba(0,0,0,0.45);
}

/* Crystal reflection sweep */
.lang-item::after {
  content: "";
  position: absolute;
  top: -70%;
  left: -70%;
  width: 220%;
  height: 220%;
  background: linear-gradient(
    120deg,
    rgba(255,255,255,0.45),
    rgba(255,255,255,0.12),
    rgba(255,255,255,0)
  );
  opacity: 0.35;
  animation: flagGlassGlow 5.5s linear infinite;
  pointer-events: none;
}

/* Hover / tap */
.lang-item:hover {
  transform: scale(1.1);
  box-shadow:
    0 0 14px rgba(212, 175, 55, 0.8),
    inset 0 3px 6px rgba(255, 255, 255, 0.45);
}

/* Active language */
.lang-item.active {
  box-shadow:
    0 0 18px rgba(212, 175, 55, 1),
    inset 0 3px 6px rgba(255, 255, 255, 0.55);
}

/* Animation */
@keyframes flagGlassGlow {
  0% {
    transform: translate(-30%, -30%);
  }
  100% {
    transform: translate(30%, 30%);
  }
}

/* Mobile comfort */
@media (max-width: 600px) {
  .lang-item {
    width: 48px;
    height: 48px;
  }
  .lang-item img {
    width: 24px;
    height: 24px;
  }
}
    
</style>
</head>

<body>

<header>
  <div class="brand">
  <img
    src="logo/nurgul-realty-hub-header.png"
    alt="Nurgul Realty Hub"
    class="brand-logo"
  >
</div>

  <div class="lang-switch">
  <span class="lang-item active" data-lang="ky">🇰🇬</span>
  <span class="lang-item" data-lang="ru">🇷🇺</span>
  <span class="lang-item" data-lang="en">🇬🇧</span>
</div>

</header>

<section class="hero">
  <div class="hero-content">
    <h1 data-i18n="hero_title">
      Ишеним — бул стиль.<br>Тандоо — бул сапат.
    </h1>
    <p data-i18n="hero_sub">
      Нургул менен кыймылсыз мүлк — бул жөн гана сатып алуу эмес.
      Бул туура чечим.
    </p>
    <a href="properties.html" class="hero-btn" data-i18n="hero_btn">
      ТУУРА ТАНДООНУ КӨРҮҮ
    </a>
  </div>
</section>

<script>
const translations={
  ky:{
    hero_title:"Ишеним — бул стиль.<br>Тандоо — бул сапат.",
    hero_sub:"Нургул менен кыймылсыз мүлк — бул жөн гана сатып алуу эмес. Бул туура чечим.",
    hero_btn:"ТУУРА ТАНДООНУ КӨРҮҮ"
  },
  ru:{
    hero_title:"Доверие — это стиль.<br>Выбор — это качество.",
    hero_sub:"С Nurgul недвижимость — это не просто покупка. Это правильное решение.",
    hero_btn:"ПОСМОТРЕТЬ ВАРИАНТЫ"
  },
  en:{
    hero_title:"Trust is a style.<br>Choice is quality.",
    hero_sub:"With Nurgul, real estate is more than a purchase. It is the right decision.",
    hero_btn:"EXPLORE OPTIONS"
  }
};

document.querySelectorAll(".lang-item").forEach(btn=>{
  btn.onclick = () => {
  const lang = btn.dataset.lang;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = translations[lang][el.dataset.i18n];
  });

  document.querySelectorAll(".lang-item").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  // ✅ ESTA LÍNEA ES LA CLAVE
  localStorage.setItem("nurgul_lang", lang);
};

});
</script>

</body>
</html>
