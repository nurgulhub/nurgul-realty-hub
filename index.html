/* ============================================================
   🌐 LANGUAGE SWITCH — GLASS FLAG (TRANSPARENT + RELIEF)
   ============================================================ */

.lang-switch {
  display: flex;
  gap: 10px;
}

.lang-item {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;

  /* Transparent base */
  background: transparent;

  /* Gold ring */
  border: 1.5px solid rgba(212, 175, 55, 0.75);

  /* Subtle outer glow */
  box-shadow:
    0 0 8px rgba(212, 175, 55, 0.45),
    inset 0 2px 4px rgba(255, 255, 255, 0.35);

  overflow: hidden;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

/* Flag with light relief */
.lang-item img {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  z-index: 2;

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.6),
    inset 0 -1px 2px rgba(0,0,0,0.35),
    0 2px 4px rgba(0,0,0,0.45);
}

/* Crystal reflection sweep */
.lang-item::after {
  content: "";
  position: absolute;
  top: -70%;
  left: -70%;
  width: 220%;
  height: 220%;
  background: linear-gradient(
    120deg,
    rgba(255,255,255,0.45),
    rgba(255,255,255,0.12),
    rgba(255,255,255,0)
  );
  opacity: 0.35;
  animation: flagGlassGlow 5.5s linear infinite;
  pointer-events: none;
}

/* Hover / tap */
.lang-item:hover {
  transform: scale(1.1);
  box-shadow:
    0 0 14px rgba(212, 175, 55, 0.8),
    inset 0 3px 6px rgba(255, 255, 255, 0.45);
}

/* Active language */
.lang-item.active {
  box-shadow:
    0 0 18px rgba(212, 175, 55, 1),
    inset 0 3px 6px rgba(255, 255, 255, 0.55);
}

/* Animation */
@keyframes flagGlassGlow {
  0% {
    transform: translate(-30%, -30%);
  }
  100% {
    transform: translate(30%, 30%);
  }
}

/* Mobile comfort */
@media (max-width: 600px) {
  .lang-item {
    width: 48px;
    height: 48px;
  }
  .lang-item img {
    width: 24px;
    height: 24px;
  }
}

    .world-clock-panel{

        inset 0 2px 10px rgba(242,201,76,0.10);

      overflow:hidden;

    .world-clock-panel::after{
      content:"";
      position:absolute;
      top:-60%;
      left:-40%;
      width:180%;
      height:180%;
      background: linear-gradient(
        120deg,
        rgba(255,255,255,0.22),
        rgba(255,255,255,0.08),
        rgba(255,255,255,0)
      );
      opacity:0.35;
      transform: rotate(8deg);
      animation: crystalSweep 7.5s linear infinite;
      pointer-events:none;
    }

    @keyframes crystalSweep{
      0%   { transform: translate(-20%, -20%) rotate(8deg); }
      100% { transform: translate(20%, 20%) rotate(8deg); }
    }

    .clock-item{

<!-- ============================================================
     🕰 WORLD CLOCK ENGINE (ADD ONLY — NO EDIT YOUR SCRIPT)
     ============================================================ -->
<script>
(() => {

  const cities = {
    bishkek:  { tz:"Asia/Bishkek" },
    istanbul: { tz:"Europe/Istanbul" },
    moscow:   { tz:"Europe/Moscow" },
    dubai:    { tz:"Asia/Dubai" },
    newyork:  { tz:"America/New_York" },
    japan:    { tz:"Asia/Tokyo" }
  };

  const labels = {
    ky: { bishkek:"Бишкек",  istanbul:"Стамбул", moscow:"Москва", dubai:"Дубай", newyork:"Нью-Йорк", japan:"Япония" },
    ru: { bishkek:"Бишкек",  istanbul:"Стамбул", moscow:"Москва", dubai:"Дубай", newyork:"Нью-Йорк", japan:"Япония" },
    en: { bishkek:"Bishkek", istanbul:"Istanbul", moscow:"Moscow", dubai:"Dubai", newyork:"New York", japan:"Japan" }
  };

  function getLang(){
    return localStorage.getItem("nurgul_lang") || document.documentElement.lang || "ky";
  }

  function format12h(date){
    let h = date.getHours();
    const m = String(date.getMinutes()).padStart(2,"0");
    const ampm = (h >= 12) ? "PM" : "AM";
    h = h % 12;
    if (h === 0) h = 12;
    return { time: `${h}:${m}`, ampm };
  }

  function nowInTZ(tz){
    // evita segundos: recalculamos sin mostrarlos
    return new Date(new Date().toLocaleString("en-US",{ timeZone: tz }));
  }

  function renderClocks(){
    const lang = getLang();
    const dict = labels[lang] || labels.ky;

    document.querySelectorAll(".clock-item[data-city]").forEach(el => {
      const key = el.dataset.city;
      const cfg = cities[key];
      if(!cfg) return;

      const now = nowInTZ(cfg.tz);
      const f = format12h(now);

      el.innerHTML = `
        <span class="clock-city">🕰 ${dict[key] || dict.bishkek}</span>
        <span class="clock-time">${f.time}</span>
        <span class="clock-ampm">${f.ampm}</span>
      `;
    });
  }

  // init
  renderClocks();

  // refresco sin segundos (cada 15s para “enganche” visual, pero sin mostrar segundos)
  setInterval(renderClocks, 15000);

  // cuando cambian banderas, re-render inmediato (sin tocar tu onclick)
  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".lang-item[data-lang]");
    if(!btn) return;
    setTimeout(renderClocks, 0);
  });

})();

/* ============================================================
   🕰 GLOBAL TIME ENGINE — NURGUL SIGNATURE
   ============================================================ */

function updateWorldTimes(){

  const zones = {
    bishkek: "Asia/Bishkek",
    istanbul: "Europe/Istanbul",
    moscow: "Europe/Moscow",
    dubai: "Asia/Dubai",
    newyork: "America/New_York",
    japan: "Asia/Tokyo"
  };

  Object.keys(zones).forEach(city => {
    const now = new Date().toLocaleString("en-US", {
      timeZone: zones[city],
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    });

    const [time, ampm] = now.split(" ");

    const timeEl = document.getElementById(`time-${city}`);
    const ampmEl = document.getElementById(`ampm-${city}`);

    if(timeEl){
      timeEl.style.opacity = 0;
      setTimeout(()=>{
        timeEl.textContent = time;
        ampmEl.textContent = ampm;
        timeEl.style.opacity = 1;
      },150);
    }
  });
}

/* Initial load */
updateWorldTimes();

/* Update every minute */
setInterval(updateWorldTimes, 60000);


/* ================= MULTI LANGUAGE CITIES ================= */

const cityTranslations = {
  ky:{
    city_bishkek:"Бишкек",
    city_istanbul:"Стамбул",
    city_moscow:"Москва",
    city_dubai:"Дубай",
    city_newyork:"Нью-Йорк",
    city_japan:"Япония"
  },
  ru:{
    city_bishkek:"Бишкек",
    city_istanbul:"Стамбул",
    city_moscow:"Москва",
    city_dubai:"Дубай",
    city_newyork:"Нью-Йорк",
    city_japan:"Япония"
  },
  en:{
    city_bishkek:"Bishkek",
    city_istanbul:"Istanbul",
    city_moscow:"Moscow",
    city_dubai:"Dubai",
    city_newyork:"New York",
    city_japan:"Japan"
  }
};

/* Hook into your existing language switch */
function updateCityLang(lang){
  document.querySelectorAll("[data-i18n^='city_']").forEach(el=>{
    const key = el.dataset.i18n;
    if(cityTranslations[lang] && cityTranslations[lang][key]){
      el.textContent = cityTranslations[lang][key];
    }
  });
}

/* Extend your existing lang switch */
document.querySelectorAll(".lang-item").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const lang = btn.dataset.lang;
    updateCityLang(lang);
  });
});

/* Load saved language on refresh */
const savedLang = localStorage.getItem("nurgul_lang") || "ky";
updateCityLang(savedLang);
  
</script>
