<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nurgul Realty — Properties</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Reutilizar el MISMO CSS del index.html -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- =====================================================
       HEADER
       👉 PEGAR AQUÍ EXACTAMENTE EL MISMO HEADER DE index.html
       👉 SIN CAMBIOS
       ===================================================== -->
  <!-- HEADER START -->
  <!-- PEGAR HEADER AQUÍ -->
  <!-- HEADER END -->


  <!-- =====================================================
       MAIN CONTENT — PROPERTIES
       ===================================================== -->
  <main class="properties-page">

    <section class="properties-grid">

      <!-- 🏠 PROPERTY CARD 1 -->
      <article class="property-card">
        <div class="property-image">
          <img src="images/property-1.jpg" alt="Luxury Apartment">
        </div>

        <div class="property-content">
          <h3>Luxury Apartment</h3>
          <p class="property-location">Bishkek · City Center</p>
          <p class="property-info">3 rooms · 120 m²</p>
          <p class="property-price">$1,200 / month</p>
          <button class="property-btn">View Details</button>
        </div>
      </article>

      <!-- 🏠 PROPERTY CARD 2 -->
      <article class="property-card">
        <div class="property-image">
          <img src="images/property-2.jpg" alt="Modern Villa">
        </div>

        <div class="property-content">
          <h3>Modern Villa</h3>
          <p class="property-location">Alamedin District</p>
          <p class="property-info">4 rooms · 260 m²</p>
          <p class="property-price">$350,000</p>
          <button class="property-btn">View Details</button>
        </div>
      </article>

      <!-- 🏠 PROPERTY CARD 3 -->
      <article class="property-card">
        <div class="property-image">
          <img src="images/property-3.jpg" alt="Family House">
        </div>

        <div class="property-content">
          <h3>Family House</h3>
          <p class="property-location">South Bishkek</p>
          <p class="property-info">5 rooms · 180 m²</p>
          <p class="property-price">$220,000</p>
          <button class="property-btn">View Details</button>
        </div>
      </article>

    </section>

  </main>

</body>
</html>
