<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<title>Nurgul Realty Hub — Properties</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#081B17;
  --panel:#0F2A24;
  --gold:#F2C94C;
  --gold-soft:#FFE08A;
  --text:#F5F7F6;
  --muted:#A8B3AF;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= HEADER ================= */

header{
  position:fixed;
  inset:0 0 auto 0;
  height:120px;
  padding:0 36px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(8,27,23,.88);
  backdrop-filter:blur(10px);
  z-index:50;
}

.brand img{
  height:280px;
  transform:translate(-40px,14px);
  filter:drop-shadow(0 0 12px rgba(242,201,76,.3));
}

.lang-switch{
  display:flex;
  align-items:center;
  gap:14px;
}

.lang-globe{
  width:22px;
  height:22px;
}

.lang-item{
  cursor:pointer;
  opacity:.45;
  font-size:18px;
}

.lang-item.active{opacity:1}

/* ================= MAIN ================= */

main{
  padding-top:180px;
  padding-bottom:120px;
}

.properties-page{
  max-width:1400px;
  margin:auto;
  padding:0 6%;
}

.section-title{
  margin-bottom:64px;
}

.section-title h2{
  font-size:clamp(28px,5vw,42px);
}

.section-title p{
  color:var(--muted);
  margin-top:10px;
}

/* ================= GRID ================= */

.properties-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:48px;
}

@media(max-width:1024px){
  .properties-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .properties-grid{grid-template-columns:1fr}
}

/* ================= CARD ================= */

.property-card{
  background:rgba(255,255,255,.03);
  border-radius:20px;
  padding:20px;
  display:flex;
  flex-direction:column;
  min-height:520px;
  border:1px solid rgba(242,201,76,.25);
}

.property-image{
  height:240px;
  border-radius:16px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:18px;
}

.property-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.property-content{
  flex:1;
  display:flex;
  flex-direction:column;
}

.property-content h3{
  font-size:18px;
  margin-bottom:6px;
}

.property-location,
.property-info,
.property-price{
  font-size:14px;
  color:var(--muted);
  margin-bottom:6px;
}

/* ================= BUTTONS ================= */

.property-actions{
  margin-top:auto;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.property-btn{
  flex:1 1 calc(33.33% - 10px);
  text-align:center;
  padding:10px 18px;
  border-radius:999px;
  border:1px solid rgba(242,201,76,.6);
  background:transparent;
  color:var(--gold);
  font-size:13px;
  cursor:pointer;
  text-decoration:none;
}

.property-btn:hover{
  background:rgba(242,201,76,.12);
}

@media(max-width:600px){
  .property-btn{flex:1 1 100%}
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  display:none;
  z-index:200;
}

.modal.active{display:block}

.modal-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(6px);
}

.modal-content{
  position:relative;
  max-width:900px;
  margin:60px auto;
  background:rgba(10,30,26,.95);
  border-radius:18px;
  padding:28px;
  border:1px solid rgba(242,201,76,.35);
  max-height:85vh;
  overflow-y:auto;
}

.modal-close{
  position:absolute;
  top:18px;
  right:18px;
  background:none;
  border:none;
  font-size:20px;
  color:var(--gold);
  cursor:pointer;
}

.modal h3{margin-bottom:14px}
.modal p{margin-bottom:12px;color:var(--muted)}
.modal ul{margin-left:18px}
.modal li{margin-bottom:6px}

/* ================= GALLERY ================= */

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:12px;
  margin-top:18px;
}

.gallery img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="logo/nurgul-realty-hub-header.png" alt="Nurgul Realty Hub">
  </div>

  <div class="lang-switch">
    <svg class="lang-globe" viewBox="0 0 24 24">
      <path fill="white" d="M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0-20Z"/>
    </svg>
    <span class="lang-item" data-lang="ky">🇰🇬</span>
    <span class="lang-item" data-lang="ru">🇷🇺</span>
    <span class="lang-item" data-lang="en">🇬🇧</span>
  </div>
</header>

<main>
<section class="properties-page">

<div class="section-title">
  <h2 data-i18n="section_title"></h2>
  <p data-i18n="section_subtitle"></p>
</div>

<section class="properties-grid">

<!-- ================= CARD 1 ================= -->

<article class="property-card">
  <div class="property-image">
    <img src="images/royal1.png">
  </div>

  <div class="property-content">
    <h3 data-i18n="royal_title"></h3>
    <p class="property-location" data-i18n="royal_location"></p>
    <p class="property-info" data-i18n="royal_short"></p>
    <p class="property-price" data-i18n="royal_price"></p>

    <div class="property-actions">
      <button class="property-btn open-royal-gallery" data-i18n="view"></button>
      <button class="property-btn open-royal-info" data-i18n="info"></button>
      <a class="property-btn" href="https://wa.me/996772630056" target="_blank">WhatsApp</a>
    </div>
  </div>
</article>

<!-- ================= CARD 2 ================= -->

<article class="property-card">
  <div class="property-image">
    <img src="images/rent7.jpg">
  </div>

  <div class="property-content">
    <h3 data-i18n="rent_title"></h3>
    <p class="property-location" data-i18n="rent_location"></p>
    <p class="property-info" data-i18n="rent_desc"></p>
    <p class="property-price" data-i18n="rent_price"></p>

    <div class="property-actions">
      <button class="property-btn open-rent-gallery" data-i18n="view"></button>
      <button class="property-btn open-rent-info" data-i18n="info"></button>
      <a class="property-btn" href="https://wa.me/996772630056" target="_blank">WhatsApp</a>
    </div>
  </div>
</article>

</section>
</section>
</main>

<!-- ================= MODALS ================= -->

<div class="modal" id="royalInfo">
  <div class="modal-overlay"></div>
  <div class="modal-content">
    <button class="modal-close">✕</button>
    <h3 data-i18n="royal_title"></h3>
    <p data-i18n="royal_dev"></p>
    <p data-i18n="royal_mgmt"></p>
    <p data-i18n="royal_design"></p>
    <p data-i18n="royal_desc"></p>
    <ul>
      <li data-i18n="royal_feat1"></li>
      <li data-i18n="royal_feat2"></li>
      <li data-i18n="royal_feat3"></li>
      <li data-i18n="royal_feat4"></li>
    </ul>
  </div>
</div>

<div class="modal" id="rentInfo">
  <div class="modal-overlay"></div>
  <div class="modal-content">
    <button class="modal-close">✕</button>
    <h3 data-i18n="rent_info_title"></h3>
    <p data-i18n="rent_info_body"></p>
  </div>
</div>

<script>

}
};

function applyLang(l){
localStorage.setItem("lang",l);
document.documentElement.lang=l;
document.querySelectorAll("[data-i18n]").forEach(e=>{
const k=e.dataset.i18n;
if(T[l][k]) e.textContent=T[l][k];
});
document.querySelectorAll(".lang-item").forEach(b=>b.classList.remove("active"));
document.querySelector(`.lang-item[data-lang="${l}"]`).classList.add("active");
}

document.querySelectorAll(".lang-item").forEach(b=>{
b.onclick=()=>applyLang(b.dataset.lang);
});

applyLang(localStorage.getItem("lang")||"ky");

/* MODALS */
function modal(id){
const m=document.getElementById(id);
m.classList.add("active");
document.body.style.overflow="hidden";
m.querySelector(".modal-close").onclick=close;
m.querySelector(".modal-overlay").onclick=close;
function close(){
m.classList.remove("active");
document.body.style.overflow="";
}
}

document.querySelector(".open-royal-info").onclick=()=>modal("royalInfo");
document.querySelector(".open-rent-info").onclick=()=>modal("rentInfo");
</script>

</body>
</html>
