<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8" />
  <title>Nurgul Realty — Properties</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Nurgul Realty — Кыймылсыз мүлк боюнча ишенимдүү чечимдер." />

  <style>
    :root{
      --green-dark:#081B17;
      --green-main:#0F2A24;
      --yellow-main:#F2C94C;
      --yellow-soft:#FFE08A;
      --text-main:#F5F7F6;
      --text-muted:#A8B3AF;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      background:var(--green-dark);
      color:var(--text-main);
      overflow-x:hidden;
    }

    /* ================= HEADER ================= */
    header{
      position:fixed;
      top:0; left:0; right:0;
      height:120px;
      padding:0 36px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      z-index:50;
      background:rgba(8,27,23,0.88);
      backdrop-filter:blur(10px);
    }

    .brand{
      display:flex;
      align-items:center;
      position:relative;
      transform: translate(-40px, 14px);
    }

    .brand-logo{
      height:280px;
      width:auto;
      display:block;
      position:relative;
      z-index:2;
      filter:
        drop-shadow(0 0 2px rgba(242,201,76,0.35))
        drop-shadow(0 0 10px rgba(242,201,76,0.18));
    }

    .brand::before{
      content:"";
      position:absolute;
      left:-80px;
      top:50%;
      transform:translateY(-50%);
      width:480px;
      height:260px;
      background:radial-gradient(
        ellipse,
        rgba(242,201,76,0.75) 0%,
        rgba(242,201,76,0.55) 25%,
        rgba(242,201,76,0.32) 45%,
        rgba(242,201,76,0.16) 60%,
        rgba(242,201,76,0.06) 72%,
        transparent 85%
      );
      filter:blur(34px);
      z-index:1;
      pointer-events:none;
    }

    .lang-switch{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .lang-item{
      font-size:18px;
      cursor:pointer;
      opacity:.45;
      transition:.2s;
    }

    .lang-item.active{
      opacity:1;
    }

    /* ================= MAIN ================= */

    main{
      padding-top:180px;
      padding-bottom:120px;
    }

    .properties-page{
      max-width:1400px;
      margin:0 auto;
      padding:0 6%;
    }

    /* --- Back button --- */
    .back-link{
  position:relative;
  z-index:60; /* 🔑 por encima del header (50) */
  display:inline-block;
  margin-bottom:48px;
  font-size:13px;
  letter-spacing:2px;
  text-decoration:none;
  color:var(--yellow-main);
  border:1px solid var(--yellow-main);
  padding:10px 22px;
  transition:.25s ease;
}

    .back-link:hover{
      background:var(--yellow-main);
      color:#000;
    }

    .properties-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:48px;
    }

    .property-card{
      display:flex;
      flex-direction:column;
    }

  .property-image{
  width:100%;
  height:260px;               /* altura de portada */
  background:rgba(255,255,255,0.08);
  border-radius:14px;
  margin-bottom:16px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
    
.property-image img{
  max-width:80%;              /* respiración premium */
  max-height:80%;
  object-fit:contain;
}

    .property-content h3{
      font-size:18px;
      font-weight:600;
      margin-bottom:8px;
    }

    .property-location,
    .property-info,
    .property-price{
      font-size:14px;
      color:var(--text-muted);
      margin-bottom:6px;
    }

    .property-btn{
      margin-top:14px;
      padding:10px 18px;
      background:transparent;
      border:1px solid rgba(255,255,255,0.35);
      border-radius:8px;
      color:var(--text-main);
      cursor:pointer;
      width:fit-content;
    }

    @media(max-width:1024px){
      .properties-grid{grid-template-columns:repeat(2,1fr)}
    }

    @media(max-width:600px){
      .properties-grid{grid-template-columns:1fr}
    }

    /* ===== SECTION TITLE ===== */

.section-title{
  margin-top:80px;        /* 🔑 baja las tarjetas respecto al header */
  margin-bottom:64px;     /* aire antes de las tarjetas */
  max-width:780px;
}

.section-title h2{
  font-size:clamp(28px,5vw,42px);
  font-weight:500;
  line-height:1.2;
  margin-bottom:14px;
}

.section-title p{
  font-size:15px;
  color:var(--text-muted);
  letter-spacing:.5px;
}
    
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="logo/nurgul-realty-hub-header.png" alt="Nurgul Realty Hub" class="brand-logo">
  </div>

  <div class="lang-switch">
  <span class="lang-item" data-lang="ky">🇰🇬</span>
  <span class="lang-item" data-lang="ru">🇷🇺</span>
  <span class="lang-item" data-lang="en">🇬🇧</span>
</div>

</header>

<main>
  <section class="properties-page">
    
<!-- ===== SECTION TITLE ===== -->
    
<div class="section-title">
  <h2 data-i18n="section_title">
    Жашоонун жаңы деңгээли ушул жерден башталат
  </h2>
  <p data-i18n="section_subtitle">
    Curated residences and premium developments
  </p>
</div>
    
    <!-- 🔙 BOTÓN RETORNO -->
    
    <a href="index.html" class="back-link" data-i18n="back">
      ← КАЙРА БАРУУ
    </a>

    <section class="properties-grid">

      <article class="property-card">
  <div class="property-image property-cover">
  <img src="images/royal1.png" alt="Royal Central Park Bishkek">
</div>
  <div class="property-content">
    <h3 data-i18n="prop_title">Турак жай</h3>
    <p class="property-location" data-i18n="prop_location">Жайгашкан жери</p>
    <p class="property-info" data-i18n="prop_info">Маалымат</p>
    <p class="property-price" data-i18n="prop_price">Баасы</p>
    <button class="property-btn" data-i18n="prop_btn">Толугураак</button>
  </div>
</article>

      <article class="property-card">
        <div class="property-image"></div>
        <div class="property-content">
          <h3 data-i18n="prop_title">Турак жай</h3>
          <p class="property-location" data-i18n="prop_location">Жайгашкан жери</p>
          <p class="property-info" data-i18n="prop_info">Маалымат</p>
          <p class="property-price" data-i18n="prop_price">Баасы</p>
          <button class="property-btn" data-i18n="prop_btn">Толугураак</button>
        </div>
      </article>

      <article class="property-card">
        <div class="property-image"></div>
        <div class="property-content">
          <h3 data-i18n="prop_title">Турак жай</h3>
          <p class="property-location" data-i18n="prop_location">Жайгашкан жери</p>
          <p class="property-info" data-i18n="prop_info">Маалымат</p>
          <p class="property-price" data-i18n="prop_price">Баасы</p>
          <button class="property-btn" data-i18n="prop_btn">Толугураак</button>
        </div>
      </article>

    </section>
  </section>
</main>

<!-- ================= IDIOMAS (FUNCIONAL + HERENCIA) ================= -->
  
<script>
const translations = {
  ky:{
    back:"← КАЙРА БАРУУ",
    section_title:"Жашоонун жаңы деңгээли ушул жерден башталат",
    section_subtitle:"Тандалган турак жайлар жана премиум долбоорлор",
    prop_title:"Турак жай",
    prop_location:"Жайгашкан жери",
    prop_info:"Маалымат",
    prop_price:"Баасы",
    prop_btn:"Толугураак"
  },
  ru:{
    back:"← НАЗАД",
    section_title:"Жизнь исключительного уровня начинается здесь",
    section_subtitle:"Отобранные жилые объекты и премиальные проекты",
    prop_title:"Недвижимость",
    prop_location:"Расположение",
    prop_info:"Информация",
    prop_price:"Цена",
    prop_btn:"Подробнее"
  },
  en:{
    back:"← BACK",
    section_title:"Where Exceptional Living Begins",
    section_subtitle:"Curated residences and premium developments",
    prop_title:"Property",
    prop_location:"Location",
    prop_info:"Details",
    prop_price:"Price",
    prop_btn:"View details"
  }
};

// aplicar idioma
function applyLang(lang){
  if(!translations[lang]) return;

  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.dataset.i18n;
    if(translations[lang][key]){
      el.innerHTML = translations[lang][key];
    }
  });

  document.querySelectorAll(".lang-item").forEach(b=>b.classList.remove("active"));
  document
    .querySelector(`.lang-item[data-lang="${lang}"]`)
    ?.classList.add("active");

  localStorage.setItem("nurgul_lang", lang);
}

// click idioma
document.querySelectorAll(".lang-item").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    applyLang(btn.dataset.lang);
  });
});

// heredar idioma desde index
const savedLang = localStorage.getItem("nurgul_lang") || "ky";
applyLang(savedLang);
  
</script>

</body>
</html>
