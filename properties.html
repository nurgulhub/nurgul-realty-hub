<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8" />
  <title>Nurgul Realty — Properties</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Nurgul Realty — Кыймылсыз мүлк боюнча ишенимдүү чечимдер." />

  <style>
    :root{
      --green-dark:#081B17;
      --green-main:#0F2A24;
      --yellow-main:#F2C94C;
      --yellow-soft:#FFE08A;
      --text-main:#F5F7F6;
      --text-muted:#A8B3AF;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      background:var(--green-dark);
      color:var(--text-main);
      overflow-x:hidden;
    }

    /* ================= HEADER (IDENTICO AL INDEX) ================= */
    header{
      position:fixed;
      top:0; left:0; right:0;
      height:120px;
      padding:0 36px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      z-index:50;
      background:rgba(8,27,23,0.88);
      backdrop-filter:blur(10px);
    }

    .brand{
      display:flex;
      align-items:center;
      position:relative;
      transform: translate(-40px, 14px);
    }

    .brand-logo{
      height:280px;
      width:auto;
      display:block;
      position:relative;
      z-index:2;
      filter:
        drop-shadow(0 0 2px rgba(242,201,76,0.35))
        drop-shadow(0 0 10px rgba(242,201,76,0.18));
    }

    .brand::before{
      content:"";
      position:absolute;
      left:-80px;
      top:50%;
      transform:translateY(-50%);
      width:480px;
      height:260px;
      background:radial-gradient(
        ellipse,
        rgba(242,201,76,0.75) 0%,
        rgba(242,201,76,0.55) 25%,
        rgba(242,201,76,0.32) 45%,
        rgba(242,201,76,0.16) 60%,
        rgba(242,201,76,0.06) 72%,
        transparent 85%
      );
      filter:blur(34px);
      z-index:1;
      pointer-events:none;
    }

    .lang-switch{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .lang-item{
      font-size:18px;
      cursor:pointer;
      opacity:.45;
    }

    .lang-item.active{
      opacity:1;
    }

    /* ================= PROPERTIES PAGE ================= */

    main{
      padding-top:180px;
      padding-bottom:120px;
    }

    .properties-page{
      max-width:1400px;
      margin:0 auto;
      padding:0 6%;
    }

    .properties-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:48px;
    }

    .property-card{
      display:flex;
      flex-direction:column;
    }

    .property-image{
      width:100%;
      height:220px;
      background:rgba(255,255,255,0.08);
      border-radius:14px;
      margin-bottom:16px;
    }

    .property-content h3{
      font-size:18px;
      font-weight:600;
      margin-bottom:8px;
    }

    .property-location,
    .property-info,
    .property-price{
      font-size:14px;
      color:var(--text-muted);
      margin-bottom:6px;
    }

    .property-btn{
      margin-top:14px;
      padding:10px 18px;
      background:transparent;
      border:1px solid rgba(255,255,255,0.35);
      border-radius:8px;
      color:var(--text-main);
      cursor:pointer;
      width:fit-content;
    }

    @media(max-width:1024px){
      .properties-grid{grid-template-columns:repeat(2,1fr)}
    }

    @media(max-width:600px){
      .properties-grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <img src="logo/nurgul-realty-hub-header.png" alt="Nurgul Realty Hub" class="brand-logo">
  </div>

  <div class="lang-switch">
    <span class="lang-item active">🇰🇬</span>
    <span class="lang-item">🇷🇺</span>
    <span class="lang-item">🇬🇧</span>
  </div>
</header>

<main>
  <section class="properties-page">
    <section class="properties-grid">

      <article class="property-card">
        <div class="property-image"></div>
        <div class="property-content">
          <h3>Турак жай</h3>
          <p class="property-location">Жайгашкан жери</p>
          <p class="property-info">Маалымат</p>
          <p class="property-price">Баасы</p>
          <button class="property-btn">Толугураак</button>
        </div>
      </article>

      <article class="property-card">
        <div class="property-image"></div>
        <div class="property-content">
          <h3>Турак жай</h3>
          <p class="property-location">Жайгашкан жери</p>
          <p class="property-info">Маалымат</p>
          <p class="property-price">Баасы</p>
          <button class="property-btn">Толугураак</button>
        </div>
      </article>

      <article class="property-card">
        <div class="property-image"></div>
        <div class="property-content">
          <h3>Турак жай</h3>
          <p class="property-location">Жайгашкан жери</p>
          <p class="property-info">Маалымат</p>
          <p class="property-price">Баасы</p>
          <button class="property-btn">Толугураак</button>
        </div>
      </article>

    </section>
  </section>
</main>

</body>
</html>
