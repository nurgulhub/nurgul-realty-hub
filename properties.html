<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8" />
  <title>Nurgul Realty — Properties</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Nurgul Realty — Кыймылсыз мүлк боюнча ишенимдүү чечимдер." />

  <style>
    :root{
      --green-dark:#081B17;
      --green-main:#0F2A24;
      --yellow-main:#F2C94C;
      --yellow-soft:#FFE08A;
      --text-main:#F5F7F6;
      --text-muted:#A8B3AF;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      background:var(--green-dark);
      color:var(--text-main);
      overflow-x:hidden;
    }

    /* ================= HEADER ================= */
    header{
      position:fixed;
      top:0; left:0; right:0;
      height:120px;
      padding:0 36px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      z-index:50;
      background:rgba(8,27,23,0.88);
      backdrop-filter:blur(10px);
    }

    .brand{
      display:flex;
      align-items:center;
      position:relative;
      transform: translate(-40px, 14px);
    }

    .brand-logo{
      height:280px;
      width:auto;
      display:block;
      position:relative;
      z-index:2;
      filter:
        drop-shadow(0 0 2px rgba(242,201,76,0.35))
        drop-shadow(0 0 10px rgba(242,201,76,0.18));
    }

    .brand::before{
      content:"";
      position:absolute;
      left:-80px;
      top:50%;
      transform:translateY(-50%);
      width:480px;
      height:260px;
      background:radial-gradient(
        ellipse,
        rgba(242,201,76,0.75) 0%,
        rgba(242,201,76,0.55) 25%,
        rgba(242,201,76,0.32) 45%,
        rgba(242,201,76,0.16) 60%,
        rgba(242,201,76,0.06) 72%,
        transparent 85%
      );
      filter:blur(34px);
      z-index:1;
      pointer-events:none;
    }

    .lang-switch{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .lang-item{
      font-size:18px;
      cursor:pointer;
      opacity:.45;
      transition:.2s;
    }

    .lang-item.active{
      opacity:1;
    }

    /* ================= MAIN ================= */

    main{
      padding-top:180px;
      padding-bottom:120px;
    }

    .properties-page{
      max-width:1400px;
      margin:0 auto;
      padding:0 6%;
    }

    /* --- Back button --- */
    .back-link{
  position:relative;
  z-index:60; /* 🔑 por encima del header (50) */
  display:inline-block;
  margin-bottom:48px;
  font-size:13px;
  letter-spacing:2px;
  text-decoration:none;
  color:var(--yellow-main);
  border:1px solid var(--yellow-main);
  padding:10px 22px;
  transition:.25s ease;
}

    .back-link:hover{
      background:var(--yellow-main);
      color:#000;
    }

    .properties-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:48px;
    }

    .property-card{
      display:flex;
      flex-direction:column;
    }

  .property-image{
  width:100%;
  height:260px;               /* altura de portada */
  background:rgba(255,255,255,0.08);
  border-radius:14px;
  margin-bottom:16px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
    
.property-image img{
  max-width:80%;              /* respiración premium */
  max-height:80%;
  object-fit:contain;
}

    .property-content h3{
      font-size:18px;
      font-weight:600;
      margin-bottom:8px;
    }

    .property-location,
    .property-info,
    .property-price{
      font-size:14px;
      color:var(--text-muted);
      margin-bottom:6px;
    }

 .property-btn{
  margin-top:18px;
  padding:12px 28px;
  background:transparent;
  border:1.4px solid rgba(242,201,76,0.65);
  border-radius:999px;
  color:var(--yellow-main);
  font-size:13px;
  letter-spacing:1.8px;
  cursor:pointer;
  transition:
    box-shadow .35s ease,
    background .35s ease,
    color .35s ease,
    transform .25s ease;
}

/* ✨ HOVER QATAR LUXURY */
    
.property-btn:hover{
  background:rgba(242,201,76,0.08);
  box-shadow:
    0 0 10px rgba(242,201,76,0.35),
    0 0 28px rgba(242,201,76,0.18);
  color:#000;
  transform:translateY(-1px);
}

/* CLICK SUAVE */
.property-btn:active{
  transform:translateY(0);
}

    @media(max-width:1024px){
      .properties-grid{grid-template-columns:repeat(2,1fr)}
    }

    @media(max-width:600px){
      .properties-grid{grid-template-columns:1fr}
    }

    /* ===== SECTION TITLE ===== */

.section-title{
  margin-top:80px;        /* 🔑 baja las tarjetas respecto al header */
  margin-bottom:64px;     /* aire antes de las tarjetas */
  max-width:780px;
}

.section-title h2{
  font-size:clamp(28px,5vw,42px);
  font-weight:500;
  line-height:1.2;
  margin-bottom:14px;
}

.section-title p{
  font-size:15px;
  color:var(--text-muted);
  letter-spacing:.5px;
}

/* ===== QATAR LUXURY HOVER — FEATURED CARD (NO FLICKER) ===== */

.featured-card{
  position:relative;
  transition:transform .45s ease, box-shadow .45s ease;
  will-change:transform;
}

/* ✅ Hover SOLO cuando NO está expandida */
.featured-card:not([data-expanded="true"]):hover{
  transform:translateY(-8px);
  box-shadow:
    0 18px 40px rgba(0,0,0,.45),
    0 0 0 1px rgba(242,201,76,.35);
}

.featured-card .property-image{
  transition:filter .45s ease;
}

.featured-card:not([data-expanded="true"]):hover .property-image{
  filter:
    drop-shadow(0 0 12px rgba(242,201,76,.25))
    brightness(1.05);
}

.featured-card .property-image img{
  transition:transform .45s ease;
}

.featured-card:not([data-expanded="true"]):hover .property-image img{
  transform:scale(1.04);
}

/* ===== EXPANDIBLE GALLERY — FEATURED CARD ===== */

.property-gallery{
  max-height:0;
  overflow:hidden;
  transition:max-height .6s ease;
  margin-top:18px;
}

.featured-card[data-expanded="true"] .property-gallery{
  max-height:520px;
}

.gallery-track{
  display:flex;
  transition:transform .5s ease;
}

.gallery-track img{
  width:100%;
  flex-shrink:0;
  border-radius:12px;
}

.gallery-controls{
  display:flex;
  justify-content:space-between;
  margin-top:12px;
}

.gallery-controls button{
  background:transparent;
  border:1px solid rgba(255,255,255,.4);
  color:#fff;
  padding:6px 14px;
  border-radius:8px;
  cursor:pointer;
}

/* ===== LIGHTBOX PREMIUM ===== */

.lightbox{
  position:fixed;
  inset:0;
  display:none;
  z-index:999;
}

.lightbox.active{
  display:block;
}

.lightbox-overlay{
  position:absolute;
  inset:0;
  background:rgba(6,14,12,.92);
  backdrop-filter:blur(6px);
}

.lightbox-content{
  position:relative;
  max-width:1100px;
  margin:6vh auto;
  padding:24px;
  background:rgba(8,27,23,.85);
  border-radius:18px;
  box-shadow:0 40px 120px rgba(0,0,0,.6);
  text-align:center;
}

.lightbox-content img{
  max-width:100%;
  max-height:65vh;
  border-radius:12px;
}

.lightbox-text{
  margin-top:18px;
}

.lightbox-text h4{
  font-size:20px;
  font-weight:500;
  margin-bottom:6px;
}

.lightbox-text p{
  font-size:14px;
  color:var(--text-muted);
}

.lightbox-close{
  position:absolute;
  top:14px;
  right:18px;
  background:none;
  border:none;
  color:#fff;
  font-size:22px;
  cursor:pointer;
}
    
</style>
</head>

<body>

<header>
  <div class="brand">

  </div>

  <div class="lang-switch">
  <span class="lang-item" data-lang="ky">🇰🇬</span>

</header>

<main>
  <section class="properties-page">

<div class="section-title">

</div>
    
    <!-- 🔙 BOTÓN RETORNO -->
    
    <a href="index.html" class="back-link" data-i18n="back">

    </a>

      <article class="property-card featured-card" data-expanded="false">

 <!-- PORTADA -->

  <!-- CONTENIDO -->

</article>


      <article class="property-card">
        <div class="property-image"></div>
        <div class="property-content">
          <h3 data-i18n="prop_title">Турак жай</h3>
          <p class="property-location" data-i18n="prop_location">Жайгашкан жери</p>
          <p class="property-info" data-i18n="prop_info">Маалымат</p>

</main>
  
<!-- ===== LIGHTBOX PREMIUM ===== -->
  
<div class="lightbox" id="lightbox">

<!-- ================= IDIOMAS (FUNCIONAL + HERENCIA) ================= -->
  
<script>
const translations = {
  ky:{
    back:"← КАЙРА БАРУУ",
    section_title:"Жашоонун жаңы деңгээли ушул жерден башталат",
    section_subtitle:"Тандалган турак жайлар жана премиум долбоорлор",
    prop_title:"Турак жай",
    prop_location:"Жайгашкан жери",
    prop_info:"Маалымат",
    prop_price:"Баасы",
    prop_btn:"Толугураак"
  },
  ru:{
    back:"← НАЗАД",
    section_title:"Жизнь исключительного уровня начинается здесь",
    section_subtitle:"Отобранные жилые объекты и премиальные проекты",
    prop_title:"Недвижимость",
    prop_location:"Расположение",
    prop_info:"Информация",
    prop_price:"Цена",
    prop_btn:"Подробнее"
  },
  en:{
    back:"← BACK",
    section_title:"Where Exceptional Living Begins",
    section_subtitle:"Curated residences and premium developments",
    prop_title:"Property",
    prop_location:"Location",
    prop_info:"Details",
    prop_price:"Price",
    prop_btn:"View details"
  }
};

// aplicar idioma
function applyLang(lang){
  if(!translations[lang]) return;

  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.dataset.i18n;
    if(translations[lang][key]){
      el.innerHTML = translations[lang][key];
    }
  });

  document.querySelectorAll(".lang-item").forEach(b=>b.classList.remove("active"));
  document
    .querySelector(`.lang-item[data-lang="${lang}"]`)
    ?.classList.add("active");

  localStorage.setItem("nurgul_lang", lang);
}

// click idioma
document.querySelectorAll(".lang-item").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    applyLang(btn.dataset.lang);
  });
});

// heredar idioma desde index
const savedLang = localStorage.getItem("nurgul_lang") || "ky";
applyLang(savedLang);
  
</script>
  
<script>
  
(() => {
  const card = document.querySelector(".featured-card");
  const toggleBtn = card.querySelector(".toggle-gallery");
  const track = card.querySelector(".gallery-track");
  const images = track.querySelectorAll("img");
  let index = 0;

  toggleBtn.addEventListener("click", () => {
    const expanded = card.getAttribute("data-expanded") === "true";
    card.setAttribute("data-expanded", !expanded);
  });

  card.querySelector(".gallery-next").onclick = () => {
    index = (index + 1) % images.length;
    track.style.transform = `translateX(-${index * 100}%)`;
  };

  card.querySelector(".gallery-prev").onclick = () => {
    index = (index - 1 + images.length) % images.length;
    track.style.transform = `translateX(-${index * 100}%)`;
  };
})();
  
</script>
  
  <script>
(() => {
  const lightbox = document.getElementById("lightbox");
  const imgBox = document.getElementById("lightbox-img");
  const titleBox = document.getElementById("lightbox-title");
  const descBox = document.getElementById("lightbox-desc");

  const captions = {
    "images/rca1.png":{
      title:"Royal Central Park — Exterior",
      desc:"Arquitectura contemporánea con integración urbana premium."
    },
    "images/rca2.png":{
      title:"Royal Central Park — Interior",
      desc:"Diseño elegante, iluminación cálida y materiales nobles."
    },
    "images/rca3.png":{
      title:"Royal Central Park — Floor Plans",
      desc:"Distribuciones optimizadas para confort y funcionalidad."
    }
  };

  document.querySelectorAll(".featured-card .gallery-track img").forEach(img=>{
    img.addEventListener("click", ()=>{
      const src = img.getAttribute("src");
      imgBox.src = src;

      if(captions[src]){
        titleBox.textContent = captions[src].title;
        descBox.textContent = captions[src].desc;
      }else{
        titleBox.textContent = "";
        descBox.textContent = "";
      }

      lightbox.classList.add("active");
    });
  });

  document.querySelector(".lightbox-close").onclick = () => {
    lightbox.classList.remove("active");
  };

  document.querySelector(".lightbox-overlay").onclick = () => {
    lightbox.classList.remove("active");
  };
})();
    
</script>
  
</body>
